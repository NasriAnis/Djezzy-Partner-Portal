{% extends "core/client_page_base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
    <div class="container" style="max-width: 440px;">
        <div class="auth-card">
            <h1 class="mb-2" style="font-size: 1.6rem;">Create your account</h1>
            <p class="text-secondary small mb-4">Register to manage your stores and order Djezzy offers.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
            </form>
            <p class="mt-4 mb-0 text-secondary small">
                Already have an account?
                <a href="{% url 'client_login' %}">Log in</a>
            </p>
        </div>
    </div>
{% endblock %}
